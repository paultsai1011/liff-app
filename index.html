<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <h2 id="msg">初始化中...</h2>
    <script>
        // 請確認這裡的 ID 是你那組正確的 LIFF ID
        liff.init({ liffId: "2010274192-bsUPl00M" })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const uid = liff.getDecodedIDToken().sub;
                    document.getElementById('msg').innerText = "成功！UID: " + uid;
                    
                    // 這邊改成你的 Google Apps Script 部署網址 (doPost 那個)
                    fetch("https://script.google.com/macros/s/AKfycbyXwY2JgUBlyJemSFEnEKTQfrT2dypjpSIVn74BH9WJRp4Jcf5-6TkNiR4MPqe2OfpJ/exec", {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ userId: uid, displayName: liff.getProfile().displayName })
                    });
                }
            })
            .catch(err => {
                document.getElementById('msg').innerText = "錯誤: " + err.message;
            });
    </script>
</body>
</html>
