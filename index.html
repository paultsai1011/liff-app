<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排班請假代班系統</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; box-sizing: border-box; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; font-size: 16px; margin-top: 5px; box-sizing: border-box; }
        button { background-color: #06C755; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #潘誠陽; }
        #loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

    <h2>排班請假申請</h2>
    <div id="loading">LINE 登入中，請稍候...</div>

    <div id="app" style="display: none;">
        <div class="form-group">
            <label>請假人：<span id="userName">載入中...</span></label>
        </div>
        
        <div class="form-group">
            <label for="leaveDate">選擇請假日期：</label>
            <input type="date" id="leaveDate" required>
        </div>

        <div class="form-group">
            <label for="leaderSelect">第一步：選擇代班人的 Leader：</label>
            <select id="leaderSelect" onchange="filterUsersByLeader()" required>
                <option value="">-- 請選擇 Leader --</option>
                <option value="湯榮銘">湯榮銘</option>
                <option value="洪偉智">洪偉智</option>
                <option value="江亞丞">江亞丞</option>
                <option value="潘誠陽">潘誠陽</option>
            </select>
        </div>

        <div class="form-group">
            <label for="coverUser">第二步：選擇代班同仁：</label>
            <select id="coverUser" disabled required>
                <option value="">-- 請先選擇上方 Leader --</option>
            </select>
        </div>

        <button id="submitBtn" onclick="submitForm()">送出請假申請</button>
    </div>

    <script>
        const LIFF_ID = '2010274192-bsUPl00M'; 
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyXwY2JgUBlyJemSFEnEKTQfrT2dypjpSIVn74BH9WJRp4Jcf5-6TkNiR4MPqe2OfpJ/exec';

        let userId = '';
        let userName = '';
        let allUsers = []; // 用來儲存從 GAS 拿到的所有使用者原始資料

        async function initLIFF() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                
                const profile = await liff.getProfile();
                userId = profile.userId;
                userName = profile.displayName;
                
                document.getElementById('userName').innerText = userName;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                
            } catch (error) {
                alert('【步驟 A 失敗】LINE LIFF 初始化或登入失敗: ' + error);
                return;
            }

            await loadAllUsers();
        }

        // 從 GAS 撈取所有人名，包含他們的 Leader 資訊
        async function loadAllUsers() {
            try {
                const params = new URLSearchParams({
                    action: 'getUsers',
                    userId: userId,
                    userName: userName
                });
                
                const response = await fetch(`${GAS_URL}?${params.toString()}`, {
                    method: 'GET',
                    mode: 'cors'
                });
                
                // 預期收到格式: [{id: '...', name: '...', leader: '...'}, ...]
                allUsers = await response.json(); 
                
            } catch (e) {
                alert('【步驟 B 失敗】連線到 Google 系統失敗。錯誤訊息: ' + e);
            }
        }

        // 當使用者切換 Leader 下拉選單時觸發
        function filterUsersByLeader() {
            const selectedLeader = document.getElementById('leaderSelect').value;
            const coverUserSelect = document.getElementById('coverUser');
            
            // 清空舊的選項
            coverUserSelect.innerHTML = '';
            
            if (!selectedLeader) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.innerText = '-- 請先選擇上方 Leader --';
                coverUserSelect.appendChild(opt);
                coverUserSelect.disabled = true;
                return;
            }
            
            // 篩選出屬於該 Leader 且「不是請假同仁自己」的成員
            const filtered = allUsers.filter(user => user.leader === selectedLeader && user.id !== userId);
            
            if (filtered.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.innerText = '❌ 該 Leader 底下目前無其他註冊同仁';
                coverUserSelect.appendChild(opt);
                coverUserSelect.disabled = true;
            } else {
                const defaultOpt = document.createElement('option');
                defaultOpt.value = '';
                defaultOpt.innerText = '-- 請選擇代班同仁 --';
                coverUserSelect.appendChild(defaultOpt);
                
                filtered.forEach(user => {
                    const opt = document.createElement('option');
                    opt.value = user.id;
                    opt.innerText = user.name;
                    coverUserSelect.appendChild(opt);
                });
                coverUserSelect.disabled = false; // 啟用選單
            }
        }

        async function submitForm() {
            const leaveDate = document.getElementById('leaveDate').value;
            const coverUser = document.getElementById('coverUser').value;
            
            if (!leaveDate || !coverUser) {
                alert('請填寫完整日期並選擇代班人！');
                return;
            }

            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').innerText = '申請送出中...';

            const payload = {
                action: 'applyLeave',
                userId: userId,
                leaveDate: leaveDate,
                coverUser: coverUser
            };

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert('🎉 申請成功！已自動發送確認訊息給代班同仁。');
                    liff.closeWindow();
                } else {
                    alert('❌ 申請失敗：' + (result.message || '未知錯誤'));
                }
            } catch (error) {
                alert('💥 連線錯誤: ' + error);
            } finally {
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').innerText = '送出請假申請';
            }
        }

        window.onload = function() {
            initLIFF();
        };
    </script>
</body>
</html>
