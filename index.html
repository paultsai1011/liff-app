<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排班請假代班系統</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 16px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #1c1c1e;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="date"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #C7C7CC;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #FFF;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #FFF;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn-primary { background-color: var(--primary-color); }

        /* 讀取中遮罩 */
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
            font-weight: bold;
            font-size: 16px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">系統初始化中...</div>
    </div>

    <div class="container">
        <h2>填寫請假代班申請</h2>
        
        <div class="form-group">
            <label for="leaveDate">📅 選擇您的請假日期：</label>
            <input type="date" id="leaveDate">
        </div>
        
        <div class="form-group">
            <label for="coverUser">👤 選擇協助代班同仁：</label>
            <select id="coverUser">
                <option value="">載入同仁清單中...</option>
            </select>
        </div>
        
        <button class="btn-primary" id="applyBtn" onclick="submitApply()">送出代班請求</button>
    </div>

    <script>
        // 確保此處 GAS 網址與您最新部署的一致
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzR7pSjP6bO7m1k2YfR1y0jGbyuT5H7fWw9z3K8D2mFw0L_bL6A3P8gX1Z_Jk1fM5_P/exec"; 
        
        let userId = "";

        window.onload = function() {
            // 初始化 LIFF
            liff.init({ liffId: "2010274192-bsUPl00M" })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        const context = liff.getContext();
                        userId = context ? context.userId : "";
                        
                        // 載入同仁清單
                        loadUserDropdown();
                    }
                })
                .catch((err) => {
                    console.error("LIFF 初始化失敗:", err);
                    showNotice("系統加載失敗，請從 LINE 內部開啟！");
                });
        };

        // 載入代班人下拉選單
        async function loadUserDropdown() {
            try {
                const response = await fetch(`${GAS_URL}?action=getUsers`);
                const users = await response.json();
                const dropdown = document.getElementById('coverUser');
                dropdown.innerHTML = '<option value="">-- 請選擇組員 --</option>';
                
                // 過濾掉操作者自己
                const otherUsers = users.filter(u => u.id !== userId);
                
                if(otherUsers.length === 0) {
                    dropdown.innerHTML = '<option value="">目前無其他已註冊的同仁</option>';
                    hideLoading();
                    return;
                }

                otherUsers.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u.id;
                    opt.textContent = `${u.name} (Leader: ${u.leader})`;
                    dropdown.appendChild(opt);
                });
                
                hideLoading();
            } catch (e) {
                console.error("載入人員失敗:", e);
                document.getElementById('coverUser').innerHTML = '<option value="">❌ 載入失敗，請重新整理</option>';
                hideLoading();
            }
        }

        // 送出請假代班申請
        async function submitApply() {
            const leaveDate = document.getElementById('leaveDate').value;
            const coverUser = document.getElementById('coverUser').value;

            if (!leaveDate) { alert("請先選擇請假日期！"); return; }
            if (!coverUser) { alert("請選擇協助代班的同仁！"); return; }

            const todayStr = new Date().toISOString().split('T')[0];
            if (leaveDate < todayStr) { alert("❌ 無法申請過去的日期！請重新選擇。"); return; }

            showLoading("正在送出申請...");
            
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'applyLeave',
                        userId: userId,
                        leaveDate: leaveDate,
                        coverUser: coverUser
                    })
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert("✨ 申請成功！已推播 Flex 邀請卡片給代班同仁審核。");
                    liff.closeWindow();
                } else {
                    alert("⚠️ 申請失敗：\n" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("網路通訊異常，請稍後再試！");
            } finaly {
                hideLoading();
            }
        }

        function showLoading(text) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }
        function showNotice(text) {
            document.getElementById('loadingText').innerHTML = `<b>${text}</b>`;
            document.getElementById('loadingOverlay').querySelector('.spinner').style.display = 'none';
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
    </script>
</body>
</html>
